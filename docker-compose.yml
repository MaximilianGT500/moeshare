services:
  moeshare:
    image: ghcr.io/maximiliangt500/moeshare:latest
    container_name: moeshare
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Berlin
      LOG_LEVEL: info
      PUID: 1000
      PGID: 1000
    volumes:
      - ./db:/opt/moeshare/db
      - ./uploads:/opt/moeshare/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    profiles:
      - caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      moeshare:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
