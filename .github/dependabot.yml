version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      server:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      oberflaeche:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
